services:
    python-service:
        build: ./python-service
        container_name: python-service
        ports:
            - "8000:8000"

    go-service:
        build: ./go-service
        container_name: go-service
        ports:
            - "8080:8080"

    rails-service:
        build: ./rail-service
        container_name: rail-service
        ports:
            - "3000:3000"
