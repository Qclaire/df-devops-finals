# kubernetes.yml

---
- name: Configure Kubernetes dependencies
  hosts: k8s_cluster
  become: true
  vars_files:
    - vars/common.yml
    - vars/kubernetes.yml
  
  tasks:
    - name: Disable swap
      command: swapoff -a
      changed_when: false
      
    - name: Remove swap from fstab
      lineinfile:
        path: /etc/fstab
        regexp: '.*swap.*'
        state: absent
        
    - name: Enable br_netfilter module
      modprobe:
        name: br_netfilter
        state: present
        
    - name: Enable required sysctl parameters
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
      with_items:
        - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { name: 'net.ipv4.ip_forward', value: '1' }
        
    - name: Add Kubernetes repository
      yum_repository:
        name: kubernetes
        description: Kubernetes Repository
        baseurl: https://packages.cloud.google.com/yum/repos/kubernetes-el7-x86_64
        gpgcheck: yes
        gpgkey: https://packages.cloud.google.com/yum/doc/yum-key.gpg https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg
        enabled: yes
      when: ansible_os_family == 'RedHat'
        
    - name: Install Kubernetes packages
      yum:
        name:
          - kubelet-{{ kubernetes_version }}
          - kubeadm-{{ kubernetes_version }}
          - kubectl-{{ kubernetes_version }}
        state: present
        disable_excludes: kubernetes
      when: ansible_os_family == 'RedHat'
        
    - name: Start and enable kubelet
      systemd:
        name: kubelet
        state: started
        enabled: yes
        
    - name: Allow Kubernetes ports in firewall
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
      with_items:
        - 6443/tcp    # Kubernetes API server
        - 2379-2380/tcp  # etcd server client API
        - 10250/tcp   # Kubelet API
        - 10251/tcp   # kube-scheduler
        - 10252/tcp   # kube-controller-manager
        - 8472/udp    # Flannel VXLAN
        - 30000-32767/tcp  # NodePort Services
      notify: Reload firewall
        
  handlers:
    - name: Reload firewall
      service:
        name: firewalld
        state: reloaded

- name: Initialize Kubernetes cluster
  hosts: k8s_master
  become: true
  vars_files:
    - vars/kubernetes.yml
  
  tasks:
    - name: Initialize the Kubernetes cluster
      shell: kubeadm init --pod-network-cidr={{ pod_network_cidr }} --kubernetes-version={{ kubernetes_version }}
      args:
        creates: /etc/kubernetes/admin.conf
        
    - name: Create .kube directory for root
      file:
        path: /root/.kube
        state: directory
        mode: '0755'
        
    - name: Copy admin.conf to root's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        mode: '0644'
        
    - name: Set up pod network with Calico
      shell: kubectl apply -f {{ calico_manifest_url }}
      args:
        creates: /opt/cni/bin/calico
        
    - name: Generate join command for worker nodes
      shell: kubeadm token create --print-join-command
      register: join_command
      
    - name: Save join command to a file
      copy:
        content: "{{ join_command.stdout }}"
        dest: /tmp/kubeadm_join_command
        mode: '0644'
        
    - name: Fetch the join command
      fetch:
        src: /tmp/kubeadm_join_command
        dest: files/kubeadm_join_command
        flat: yes
        
    - name: Remove join command file
      file:
        path: /tmp/kubeadm_join_command
        state: absent

- name: Join workers to the Kubernetes cluster
  hosts: k8s_workers
  become: true
  
  tasks:
    - name: Copy join command from master
      copy:
        src: files/kubeadm_join_command
        dest: /tmp/kubeadm_join_command
        mode: '0777'
        
    - name: Join the Kubernetes cluster
      shell: sh /tmp/kubeadm_join_command
      args:
        creates: /etc/kubernetes/kubelet.conf
        
    - name: Remove join command file
      file:
        path: /tmp/kubeadm_join_command
        state: absent