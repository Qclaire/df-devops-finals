# jenkins.yml
---
- name: Install and configure Jenkins
  hosts: jenkins
  become: true
  vars_files:
      - vars/common.yml
      - vars/jenkins.yml

  tasks:
      - name: Add Jenkins repository
        yum_repository:
            name: jenkins
            description: Jenkins repository
            baseurl: http://pkg.jenkins.io/redhat-stable
            gpgcheck: yes
            gpgkey: https://pkg.jenkins.io/redhat-stable/jenkins.io.key
        when: ansible_os_family == 'RedHat'

      - name: Install Java
        yum:
            name: java-11-openjdk
            state: present
        when: ansible_os_family == 'RedHat'

      - name: Install Jenkins
        yum:
            name: jenkins
            state: present
        when: ansible_os_family == 'RedHat'
        notify: Start Jenkins

      - name: Open Jenkins port in firewall
        firewalld:
            port: 8080/tcp
            permanent: yes
            state: enabled
        notify: Reload firewall

      - name: Create Jenkins init scripts directory
        file:
            path: /var/lib/jenkins/init.groovy.d
            state: directory
            owner: jenkins
            group: jenkins
            mode: "0755"

      - name: Copy Jenkins init script for security
        template:
            src: templates/basic-security.groovy.j2
            dest: /var/lib/jenkins/init.groovy.d/basic-security.groovy
            owner: jenkins
            group: jenkins
            mode: "0644"
        notify: Restart Jenkins

      - name: Wait for Jenkins to start up
        uri:
            url: http://localhost:8080
            status_code: 200
            timeout: 5
        register: jenkins_service_status
        until: jenkins_service_status.status == 200
        retries: 60
        delay: 5
        ignore_errors: yes

      - name: Get Jenkins initial admin password
        shell: cat /var/lib/jenkins/secrets/initialAdminPassword
        register: jenkins_admin_password
        changed_when: false

      - name: Show Jenkins initial admin password
        debug:
            msg: "Jenkins initial admin password: {{ jenkins_admin_password.stdout }}"

      - name: Install Jenkins plugins
        jenkins_plugin:
            name: "{{ item }}"
            jenkins_home: /var/lib/jenkins
            url_username: admin
            url_password: "{{ jenkins_admin_password.stdout }}"
            state: present
            timeout: 120
        with_items: "{{ jenkins_plugins }}"
        register: plugin_result
        until: plugin_result is success
        retries: 3
        delay: 5
        notify: Restart Jenkins

      - name: Install Docker CLI for Jenkins
        yum:
            name: docker-ce-cli
            state: present
        when: ansible_os_family == 'RedHat'

      - name: Install kubectl for Jenkins
        yum:
            name: kubectl
            state: present
            disable_excludes: kubernetes
        when: ansible_os_family == 'RedHat'

      - name: Add jenkins user to docker group
        user:
            name: jenkins
            groups: docker
            append: yes
        notify: Restart Jenkins

      - name: Create Jenkins Kubernetes credentials script
        template:
            src: templates/kubernetes-credentials.groovy.j2
            dest: /var/lib/jenkins/init.groovy.d/kubernetes-credentials.groovy
            owner: jenkins
            group: jenkins
            mode: "0644"
        notify: Restart Jenkins

  handlers:
      - name: Start Jenkins
        systemd:
            name: jenkins
            state: started
            enabled: yes

      - name: Restart Jenkins
        systemd:
            name: jenkins
            state: re
