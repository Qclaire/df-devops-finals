k8s_master:
    master:
        ansible_host: <MASTER_IP>
        ansible_user: ec2-user
        ansible_ssh_private_key_file: ~/.ssh/id_rsa

k8s_workers:
    worker1:
        ansible_host: <WORKER1_IP>
        ansible_user: ec2-user
        ansible_ssh_private_key_file: ~/.ssh/id_rsa
    worker2:
        ansible_host: <WORKER2_IP>
        ansible_user: ec2-user
        ansible_ssh_private_key_file: ~/.ssh/id_rsa

k8s_cluster:
    children:
        - k8s_master
        - k8s_workers

jenkins:
    jenkins:
        ansible_host: <JENKINS_IP>
        ansible_user: ec2-user
        ansible_ssh_private_key_file: ~/.ssh/id_rsa
